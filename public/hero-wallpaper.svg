<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="blue-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60a5fa" />
      <stop offset=".5" stop-color="#bfdbfe" />
      <stop offset="1" stop-color="#e0f2fe" />
    </linearGradient>
    <radialGradient id="blue-glow" cx=".5" cy=".28" r=".68">
      <stop stop-color="#1d4ed8" stop-opacity=".72" />
      <stop offset=".48" stop-color="#2563eb" stop-opacity=".46" />
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#faf9f7" />
      <stop offset="1" stop-color="#f1f0ef" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .13" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="800" fill="url(#blue-wash)" />
  <rect width="1600" height="800" fill="url(#blue-glow)" />
  <rect width="1600" height="800" filter="url(#grain)" opacity=".65" />
</svg>
